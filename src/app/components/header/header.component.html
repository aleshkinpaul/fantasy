<div class="header-container"
  [ngClass]="{
      'ucl': name === 'champions-league',
      'cwc': name === 'club-world-cup'
  }">
  <div class="main-container">
    <div class="left-container">
      <div class="logo-container" role="button" tabindex="0" aria-label="На главную" (click)="goHome()" (keydown.enter)="goHome()">
        <img src="assets/logos/main-logo-circle.png" alt="fr fantasy logo" class="logo-img">
      </div>
      <h1 class="main-title">FR Fantasy</h1>
    </div>
    <nav class="main-nav" aria-label="Главное меню">
      <a
        routerLink="/tournaments"
        routerLinkActive="active"
        [routerLinkActiveOptions]="{ exact: true }"
      >Турниры</a>
      <a routerLink="/hall-of-fame" routerLinkActive="active">Зал славы</a>
      <a routerLink="/rating" routerLinkActive="active">Рейтинг</a>
    </nav>
    <ng-container *ngIf="personalization.state$ | async as personalizationState">
      <button
        *ngIf="personalizationState.mode !== 'loading'"
        type="button"
        class="viewer-button"
        [attr.aria-label]="'Текущий пользователь: ' + personalizationLabel(personalizationState) + '. Изменить'"
        (click)="personalization.openPicker()"
      >
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M20 21a8 8 0 0 0-16 0m8-10a4 4 0 1 0 0-8 4 4 0 0 0 0 8Z"></path>
        </svg>
        <span>{{ personalizationLabel(personalizationState) }}</span>
      </button>
    </ng-container>
    <div class="right-container" *ngIf="!isMain">
      <h2 class="main-title">{{ subTitle }}</h2>
    </div>
  </div>
</div>
