name: Deploy production to Beget

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-beget
  cancel-in-progress: false

jobs:
  deploy:
    name: Build and deploy
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build production bundle
        run: npm run mypage

      - name: Verify build output
        run: |
          test -f dist/fr-fantasy/index.html
          printf '%s\n' "$GITHUB_SHA" > dist/fr-fantasy/deploy-version.txt

      - name: Install FTPS client
        run: sudo apt-get update && sudo apt-get install --yes lftp

      - name: Upload production bundle
        timeout-minutes: 10
        env:
          BEGET_FTP_HOST: ${{ secrets.BEGET_FTP_HOST }}
          BEGET_FTP_USER: ${{ secrets.BEGET_FTP_USER }}
          BEGET_FTP_PASSWORD: ${{ secrets.BEGET_FTP_PASSWORD }}
          BEGET_FTP_PATH: ${{ vars.BEGET_FTP_PATH }}
        run: |
          set -euo pipefail

          : "${BEGET_FTP_HOST:?GitHub secret BEGET_FTP_HOST is not configured}"
          : "${BEGET_FTP_USER:?GitHub secret BEGET_FTP_USER is not configured}"
          : "${BEGET_FTP_PASSWORD:?GitHub secret BEGET_FTP_PASSWORD is not configured}"

          remote_path="${BEGET_FTP_PATH:-/}"
          connection_url="$BEGET_FTP_HOST"
          case "$connection_url" in
            ftp://*|ftps://*|sftp://*) ;;
            *) connection_url="ftp://$connection_url" ;;
          esac

          # Beget opens SFTP sessions in the account home directory. Treat a
          # configured leading slash as home-relative instead of filesystem-root.
          if [[ "$connection_url" == sftp://* ]]; then
            remote_path="${remote_path#/}"
          fi

          deploy_log="$(mktemp)"
          trap 'rm -f "$deploy_log"' EXIT

          set +e
          lftp -u "$BEGET_FTP_USER,$BEGET_FTP_PASSWORD" "$connection_url" \
            > "$deploy_log" 2>&1 <<LFTP
          set net:max-retries 3
          set net:timeout 30
          set ftp:ssl-force true
          set ftp:ssl-protect-data true
          set ssl:verify-certificate true
          set sftp:auto-confirm true
          set sftp:max-packets-in-flight 64
          # Beget does not preserve source mtimes consistently. Comparing
          # timestamps would resend the entire ~250 MB build on every run.
          mirror --reverse --verbose --parallel=4 --ignore-time \
            --exclude-glob=index.html \
            "dist/fr-fantasy/" "$remote_path"

          # Tournament JSON uses stable filenames, so refresh it even when an
          # edit happens to leave the file size unchanged.
          mirror --reverse --verbose --parallel=4 --transfer-all \
            "dist/fr-fantasy/assets/data/" "${remote_path%/}/assets/data/"

          put -O "$remote_path" "dist/fr-fantasy/index.html"
          bye
          LFTP
          lftp_status=$?
          set -e
          cat "$deploy_log"

          if [ "$lftp_status" -ne 0 ]; then
            if grep -Eqi 'authentication failed|login failed|incorrect password|permission denied.*password' "$deploy_log"; then
              diagnosis='SFTP authentication failed. Check SSH access and the Beget account credentials.'
            elif grep -Eqi 'could not resolve|name or service not known|connection refused|connection timed out|host key verification failed|no route to host' "$deploy_log"; then
              diagnosis='SFTP connection failed. Check the server hostname, port 22, and SSH availability.'
            elif grep -Eqi 'no such file|not found|access failed|permission denied' "$deploy_log"; then
              diagnosis='The deployment directory is unavailable. Check BEGET_FTP_PATH and write permissions.'
            else
              diagnosis='The SFTP client returned an unclassified error. Open the private workflow log for details.'
            fi
            echo "::error title=Beget deployment failed::$diagnosis"
            exit "$lftp_status"
          fi

      - name: Check production website
        run: |
          deployed_sha="$(curl --fail --location --retry 3 --retry-delay 5 \
            "https://fr-fantasy.ru/deploy-version.txt?sha=$GITHUB_SHA")"
          test "$deployed_sha" = "$GITHUB_SHA"
